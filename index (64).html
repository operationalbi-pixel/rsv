<body>
  <main class="app" id="app">
    <div class="top-brand">
      <div class="brand-left"><div class="brand-logo"><span class="material-icons-round">restaurant</span></div><div><div>Bakerzin</div><div class="brand-note">Reservation & Order</div></div></div>
    </div>

    <section id="home" class="page active">
      <div class="service-grid">
        <button type="button" class="service-card js-flow" id="btn-flow-reservation" data-flow="reservation" onclick="return openFlow('reservation')"><div class="service-icon"><span class="material-icons-round">event_available</span></div><h3>Reservasi</h3><p>Booking meja dan bisa sekalian memilih menu untuk reservasi Anda.</p></button>
        <button type="button" class="service-card js-flow" id="btn-flow-delivery" data-flow="delivery" onclick="return openFlow('delivery')"><div class="service-icon"><span class="material-icons-round">local_shipping</span></div><h3>Delivery</h3><p>Pesanan diantar dari outlet Bakerzin pilihan Anda.</p></button>
        <button type="button" class="service-card js-flow" id="btn-flow-takeaway" data-flow="takeaway" onclick="return openFlow('takeaway')"><div class="service-icon"><span class="material-icons-round">shopping_bag</span></div><h3>Pickup / Take Away</h3><p>Pesan lebih dulu, ambil di outlet pada jam yang Anda pilih.</p></button>
      </div>
      <div class="debug-box" id="debug-box"></div>
    </section>

    <section id="form-page" class="page">
      <div class="panel">
        <div class="section-head"><div><h2 id="form-title">Reservasi</h2><p id="form-subtitle">Lengkapi data Anda.</p></div><button type="button" class="back-btn" onclick="return goHome()"><span class="material-icons-round">arrow_back</span> Kembali</button></div>

        <div id="reservation-form" class="form-grid">
          <div class="field"><label>Nama</label><input id="res-name" type="text" autocomplete="name"></div>
          <div class="field"><label>No Telp</label><input id="res-phone" type="tel" inputmode="tel" autocomplete="tel"></div>
          <div class="field"><label>Jumlah Pax</label><input id="res-pax" type="number" min="1" inputmode="numeric" placeholder="Contoh: 4"></div>
          <div class="field"><label>Outlet</label><select id="res-outlet" onchange="checkReservationOutlet()"><option value="">Pilih Outlet</option></select></div>
          <div class="field"><label>Tanggal</label><input id="res-date" type="date" onchange="checkReservationOutlet()"></div>
          <div class="field"><label>Jam</label><input id="res-time" type="time" onchange="checkReservationOutlet()"></div>
          <div class="field full"><label>Keterangan</label><textarea id="res-note" placeholder="Special request / catatan reservasi"></textarea></div>
          <div id="reservation-warning" class="warning"></div>
          <div class="field full"><label>Apakah Anda ingin sekalian memesan menu untuk Reservasi Anda?</label><div class="choice-row"><button type="button" class="choice" id="res-menu-yes" onclick="return setReservationMenuChoice(true)"><span class="material-icons-round">check_circle</span> YES</button><button type="button" class="choice active" id="res-menu-no" onclick="return setReservationMenuChoice(false)"><span class="material-icons-round">cancel</span> NO</button></div></div>
          <div class="field full" id="reservation-menu-action" style="display:none"><button type="button" class="soft-btn" onclick="return openMenuSelector()"><span class="material-icons-round">restaurant_menu</span> Pilih Menu Reservasi</button></div>
          <div class="field full"><button type="button" class="primary-btn" id="btn-res-submit" onclick="return openPreview()"><span class="material-icons-round">visibility</span> Preview Reservasi</button></div>
        </div>

        <div id="order-form" class="form-grid" style="display:none">
          <div class="field"><label>Nama Pemesan</label><input id="ord-name" type="text" autocomplete="name" oninput="syncRecipient()"></div>
          <div class="field"><label>No Telp Pemesan</label><input id="ord-phone" type="tel" inputmode="tel" autocomplete="tel" oninput="syncRecipient()"></div>
          <div class="field full checkbox-field" id="delivery-recipient"><label class="checkbox-label" for="same-recipient"><input id="same-recipient" type="checkbox" onchange="syncRecipient()"><span>Penerima sama dengan pemesan</span></label></div>
          <div class="field" id="delivery-recipient-name"><label>Nama Penerima</label><input id="rcp-name" type="text"></div>
          <div class="field" id="delivery-recipient-phone"><label>No Telp Penerima</label><input id="rcp-phone" type="tel" inputmode="tel"></div>
          <div class="field"><label id="order-outlet-label">Outlet</label><select id="ord-outlet"><option value="">Pilih Outlet</option></select></div>
          <div class="field"><label id="order-date-label">Tanggal</label><input id="ord-date" type="date"></div>
          <div class="field"><label id="order-time-label">Jam</label><input id="ord-time" type="time"></div>
          <div class="field full" id="delivery-address"><label>Alamat Pengantaran</label><textarea id="ord-address"></textarea></div>
          <div class="field full"><label>Keterangan / Request</label><textarea id="ord-note"></textarea></div>
          <div class="field full"><button type="button" class="soft-btn" onclick="return openMenuSelector()"><span class="material-icons-round">restaurant_menu</span> Pilih Menu</button></div>
          <div class="field full"><button type="button" class="primary-btn" onclick="return openPreview()"><span class="material-icons-round">visibility</span> Preview Pesanan</button></div>
        </div>
      </div>
    </section>

    <section id="menu-page" class="page">
      <div class="section-head"><div><h2>Pilih Menu</h2><p>Gunakan pencarian atau tab kategori.</p></div><button type="button" class="back-btn" onclick="return backToForm()"><span class="material-icons-round">arrow_back</span> Form</button></div>
      <div class="menu-layout">
        <aside class="panel menu-sidebar"><strong>Kategori</strong><div class="category-list" id="category-list"></div></aside>
        <div><div class="menu-search"><span class="material-icons-round search-icon">search</span><input id="menu-search" type="search" placeholder="Cari menu..." oninput="setMenuSearch(this.value)"><button type="button" id="menu-search-clear" class="clear-search" onclick="return clearMenuSearch()"><span class="material-icons-round" style="font-size:18px">close</span></button></div><h3 id="menu-category-title" style="margin:0 0 12px">Rekomendasi</h3><div class="menu-grid" id="menu-grid"></div></div>
      </div>
    </section>

    <section id="success-page" class="page"><div class="panel success"><div class="success-icon"><span class="material-icons-round" style="font-size:42px">check_circle</span></div><h2>Berhasil</h2><p id="success-message"></p><br><button type="button" class="primary-btn" onclick="return resetApp()"><span class="material-icons-round">home</span> Kembali ke Awal</button></div></section>
  </main>

  <nav class="bottom-nav" id="bottom-nav"><button type="button" onclick="return openFlow('reservation')" data-nav="reservation"><span class="material-icons-round">event_available</span><span class="label">Reservasi</span></button><button type="button" onclick="return openFlow('delivery')" data-nav="delivery"><span class="material-icons-round">local_shipping</span><span class="label">Delivery</span></button><button type="button" onclick="return openFlow('takeaway')" data-nav="takeaway"><span class="material-icons-round">shopping_bag</span><span class="label">Pickup</span></button></nav>
  <div class="cart-bar" id="cart-bar"><div class="cart-meta"><strong id="cart-count">0 item</strong><span id="cart-total">Rp 0</span></div><button type="button" onclick="return backToForm()">Selesai</button></div>

  <div class="modal" id="preview-modal"><div class="modal-content"><div class="modal-head"><h3>Preview</h3><button type="button" class="modal-close" onclick="return closePreview()"><span class="material-icons-round">close</span></button></div><div id="preview-body"></div><br><button type="button" class="primary-btn" id="confirm-submit" onclick="return submitCurrentFlow()"><span class="material-icons-round">send</span> Submit</button></div></div>

  <script>
  (function(){
    var PATCH = 'CUSTOMER_APP_V12_MOBILE_LAYOUT_FIX_20260517';
    var DEMO_MENU = [
      {id:'d1',category:'Rekomendasi',name:'Nasi Goreng Oxtail',price:158000,image:''},
      {id:'d2',category:'Rekomendasi',name:'Oxtail Soup',price:188000,image:''},
      {id:'d3',category:'Rekomendasi',name:'Chocolate Amer',price:78000,image:''},
      {id:'d4',category:'Main Course',name:'Bakerzin Fried Rice',price:98000,image:''},
      {id:'d5',category:'Dessert',name:'Warm Chocolate Cake',price:72000,image:''}
    ];
    var State = {flow:null,outlets:[],catalog:{categories:['Rekomendasi','All','Main Course','Dessert'],items:DEMO_MENU,recommendations:DEMO_MENU.slice(0,3)},category:'Rekomendasi',menuSearch:'',cart:{},wantsMenu:false,lastMenuPhone:''};

    function $(id){return document.getElementById(id);} 

    // GITHUB VERSION: frontend di-host di GitHub Pages, backend tetap Google Apps Script API.
    var API_URL = 'https://script.google.com/macros/s/AKfycbx4LFTHRJMG3QlvFTVagTXzei9277H7OyCWhzTkbr7PpN6pAaUOFln_U2RJ1BoEspzJDg/exec';
    function hasBackend(){return !!API_URL;}
    function apiCall(action,payload){
      payload=payload||{};
      return fetch(API_URL,{
        method:'POST',
        redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:action,payload:payload})
      }).then(function(res){
        if(!res.ok) throw new Error('HTTP '+res.status);
        return res.json();
      });
    }
    function each(list,fn){Array.prototype.forEach.call(list,fn);} 
    function addClass(el,c){if(el && el.classList) el.classList.add(c);} 
    function removeClass(el,c){if(el && el.classList) el.classList.remove(c);} 
    function toggleClass(el,c,on){if(!el||!el.classList)return; if(on)el.classList.add(c); else el.classList.remove(c);} 
    function escapeHtml(s){s=(s===null||s===undefined)?'':String(s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
    function money(n){n=Math.round(Number(n)||0);return 'Rp '+n.toLocaleString('id-ID');}
    function today(){var d=new Date();var m=('0'+(d.getMonth()+1)).slice(-2);var day=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+day;}
    function normalizePhone(p){var d=String(p||'').replace(/\D/g,'');if(!d)return'';if(d.indexOf('62')===0)return'0'+d.substring(2);if(d.indexOf('8')===0)return'0'+d;return d;}
    function currentPhone(){return State.flow==='reservation' && $('res-phone') ? $('res-phone').value : ($('ord-phone') ? $('ord-phone').value : '');}
    function debug(msg){var box=$('debug-box'); if(!box)return; box.textContent=msg; addClass(box,'visible');}

    function showPage(id){
      var target=$(id); if(!target)return false;
      each(document.querySelectorAll('.page'),function(p){removeClass(p,'active');});
      addClass(target,'active');
      /* PATCH V12: hide bottom nav on home/menu/success so the service cards stay clean. */
      var nav=$('bottom-nav');
      if(nav) nav.style.display=(id==='form-page')?'flex':'none';
      /* PATCH V12: cart bar must never stay visible outside menu page. */
      var cart=$('cart-bar');
      if(cart && id!=='menu-page') removeClass(cart,'visible');
      if(id==='menu-page') updateCart();
      return false;
    }

    function driveImageUrl(raw){
      if(!raw)return '';
      var s=String(raw).trim();
      var q=s.match(/["'](https?:\/\/[^"']+)["']/); if(q&&q[1])s=q[1].trim();
      var patterns=[/\/file\/d\/([a-zA-Z0-9_-]+)/,/\/d\/([a-zA-Z0-9_-]+)/,/[?&]id=([a-zA-Z0-9_-]+)/,/thumbnail\?id=([a-zA-Z0-9_-]+)/];
      var id='';
      for(var i=0;i<patterns.length;i++){var m=s.match(patterns[i]);if(m&&m[1]){id=m[1];break;}}
      return id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1000':s;
    }

    function init(){
      try{
        bindClicks();
        if($('res-date')) $('res-date').value=today();
        if($('ord-date')) $('ord-date').value=today();
        loadOutlets();
        loadCatalog('');
      }catch(e){debug('Error init: '+(e&&e.message?e.message:e));}
    }

    function bindClicks(){
      each(document.querySelectorAll('.js-flow'),function(el){
        el.addEventListener('click',function(ev){
          ev.preventDefault(); ev.stopPropagation();
          return openFlow(el.getAttribute('data-flow'));
        },false);
      });
      document.addEventListener('click',function(ev){
        var el=ev.target;
        while(el && el!==document){
          if(el.getAttribute && el.getAttribute('data-flow')){ev.preventDefault();return openFlow(el.getAttribute('data-flow'));}
          if(el.getAttribute && el.getAttribute('data-category')){ev.preventDefault();return setCategory(el.getAttribute('data-category'));}
          if(el.getAttribute && el.getAttribute('data-menu-action')){ev.preventDefault();return changeQty(el.getAttribute('data-menu-name'),parseInt(el.getAttribute('data-menu-delta'),10)||0);}
          el=el.parentNode;
        }
      },false);
    }

    function loadOutlets(){
      if(!hasBackend()){State.outlets=['Bakerzin Plaza Indonesia','Bakerzin Kota Kasablanka','Bakerzin Central Park'];fillOutlets();return;}
      apiCall('getOutlets',{}).then(function(res){State.outlets=(res&&res.outlets)||[];fillOutlets();}).catch(function(err){console.error('getOutlets:',err);State.outlets=[];fillOutlets();});
    }
    function fillOutlets(){
      var html='<option value="">Pilih Outlet</option>';
      for(var i=0;i<State.outlets.length;i++){html+='<option value="'+escapeHtml(State.outlets[i])+'">'+escapeHtml(State.outlets[i])+'</option>';}
      if($('res-outlet')) $('res-outlet').innerHTML=html;
      if($('ord-outlet')) $('ord-outlet').innerHTML=html;
    }
    function normalizeCatalog(res){ /* CATEGORY ORDER FIX V9: preserve DB order */
      res=res||{};var items=Object.prototype.toString.call(res.items)==='[object Array]'?res.items:[];var recs=Object.prototype.toString.call(res.recommendations)==='[object Array]'?res.recommendations:[];var cats=Object.prototype.toString.call(res.categories)==='[object Array]'?res.categories.slice(0):[];
      if(!cats.length){var seen={};for(var i=0;i<items.length;i++){if(items[i]&&items[i].category&&!seen[items[i].category]){seen[items[i].category]=true;cats.push(items[i].category);}}}
      var clean=[];for(var j=0;j<cats.length;j++){if(cats[j]&&cats[j]!=='Rekomendasi'&&cats[j]!=='All')clean.push(cats[j]);}
      clean.unshift('All');clean.unshift('Rekomendasi');return {success:true,categories:clean,items:items,recommendations:recs};
    }
    function loadCatalog(phone){
      State.lastMenuPhone=normalizePhone(phone||'');
      if(!hasBackend()){renderCategories();renderMenu();return;}
      apiCall('getMenuCatalog',{phone:phone||''}).then(function(res){if(res&&res.success)State.catalog=normalizeCatalog(res);State.category='Rekomendasi';renderCategories();renderMenu();}).catch(function(err){console.error('getMenuCatalog:',err);renderCategories();renderMenu();});
    }
    function maybeRefreshMenu(){var p=normalizePhone(currentPhone());if(p&&p!==State.lastMenuPhone)loadCatalog(p);}

    function openFlow(flow){
      try{
        if(flow!=='reservation'&&flow!=='delivery'&&flow!=='takeaway')flow='reservation';
        State.flow=flow;State.cart={};State.wantsMenu=false;updateNav();
        if($('reservation-form')) $('reservation-form').style.display=flow==='reservation'?'grid':'none';
        if($('order-form')) $('order-form').style.display=flow==='reservation'?'none':'grid';
        if(flow==='reservation'){
          $('form-title').textContent='Reservasi';$('form-subtitle').textContent='Pilih outlet dan waktu reservasi Anda.';setReservationMenuChoice(false);
        }else{
          var isDel=flow==='delivery';$('form-title').textContent=isDel?'Delivery':'Pickup / Take Away';$('form-subtitle').textContent=isDel?'Pesanan akan diantar dari outlet pilihan Anda.':'Pesanan diambil langsung di outlet Bakerzin.';
          setDisplay('delivery-recipient',isDel?'flex':'none');setDisplay('delivery-recipient-name',isDel?'flex':'none');setDisplay('delivery-recipient-phone',isDel?'flex':'none');setDisplay('delivery-address',isDel?'flex':'none');
          
          $('order-outlet-label').textContent=isDel?'Outlet Terdekat':'Pickup At Store';$('order-date-label').textContent=isDel?'Tanggal Antar':'Tanggal Pengambilan';$('order-time-label').textContent=isDel?'Jam Antar':'Jam Pengambilan';
        }
        updateCart();showPage('form-page');
      }catch(e){debug('Error buka form: '+(e&&e.message?e.message:e));}
      return false;
    }
    function setDisplay(id,v){var el=$(id);if(el)el.style.display=v;}
    function updateNav(){each(document.querySelectorAll('[data-nav]'),function(b){toggleClass(b,'active',b.getAttribute('data-nav')===State.flow);});}
    function goHome(){showPage('home');return false;}
    function resetApp(){State.cart={};State.flow=null;showPage('home');updateCart();return false;}
    function syncRecipient(){var same=$('same-recipient');if(same&&same.checked){$('rcp-name').value=$('ord-name').value;$('rcp-phone').value=$('ord-phone').value;}return false;}
    function setReservationMenuChoice(v){State.wantsMenu=!!v;toggleClass($('res-menu-yes'),'active',!!v);toggleClass($('res-menu-no'),'active',!v);setDisplay('reservation-menu-action',v?'block':'none');if(v)maybeRefreshMenu();return false;}
    function checkReservationOutlet(){var outlet=$('res-outlet').value,date=$('res-date').value,time=$('res-time').value,warn=$('reservation-warning');removeClass(warn,'visible');if($('btn-res-submit'))$('btn-res-submit').disabled=false;if(!outlet||!time||!hasBackend())return false;apiCall('checkOutletReservationAvailability',{outlet:outlet,date:date,time:time}).then(function(res){if(res&&!res.available){warn.textContent=res.message||'Outlet sedang tidak menerima reservasi pada jam tersebut.';addClass(warn,'visible');$('btn-res-submit').disabled=true;}}).catch(function(err){console.error('checkReservationOutlet:',err);});return false;}

    function openMenuSelector(){maybeRefreshMenu();State.category='Rekomendasi';State.menuSearch='';if($('menu-search'))$('menu-search').value='';toggleClass($('menu-search-clear'),'visible',false);renderCategories();renderMenu();showPage('menu-page');updateCart();return false;}
    function backToForm(){showPage('form-page');updateCart();return false;}
    function renderCategories(){var cats=(State.catalog&&State.catalog.categories)?State.catalog.categories.slice(0):['Rekomendasi','All'];if(cats.indexOf('Rekomendasi')<0)cats.unshift('Rekomendasi');if(cats.indexOf('All')<0)cats.splice(1,0,'All');var html='';for(var i=0;i<cats.length;i++){var c=cats[i];html+='<button type="button" class="cat-btn'+(c===State.category?' active':'')+'" data-category="'+escapeHtml(c)+'">'+(c==='Rekomendasi'?'<span class="material-icons-round rec-thumb">thumb_up</span>':'')+escapeHtml(c)+'</button>';}if($('category-list'))$('category-list').innerHTML=html;}
    function setCategory(c){State.category=c||'All';renderCategories();renderMenu();return false;}
    function setMenuSearch(v){State.menuSearch=v||'';toggleClass($('menu-search-clear'),'visible',!!State.menuSearch);renderMenu();return false;}
    function clearMenuSearch(){if($('menu-search'))$('menu-search').value='';return setMenuSearch('');}
    function categoryItems(){var items=[],all=(State.catalog&&State.catalog.items)?State.catalog.items:[];if(State.category==='Rekomendasi'){items=(State.catalog.recommendations&&State.catalog.recommendations.length)?State.catalog.recommendations:[];}else if(State.category==='All'){items=all;}else{for(var i=0;i<all.length;i++){if(all[i].category===State.category)items.push(all[i]);}}var q=String(State.menuSearch||'').toLowerCase().trim();if(q){var filtered=[];for(var j=0;j<items.length;j++){var nm=String(items[j].name||'').toLowerCase(),ct=String(items[j].category||'').toLowerCase();if(nm.indexOf(q)>=0||ct.indexOf(q)>=0)filtered.push(items[j]);}items=filtered;}return items;}
    function renderMenu(){var title=$('menu-category-title'),grid=$('menu-grid');if(!grid)return;if(title)title.textContent=State.category+(State.menuSearch?' · pencarian':'');var items=categoryItems(),html='';for(var i=0;i<items.length;i++){var it=items[i]||{},name=String(it.name||''),qty=(State.cart[name]&&State.cart[name].qty)?State.cart[name].qty:0,img=driveImageUrl(it.image||it.imageSource||'');html+='<div class="menu-card"><div class="menu-photo">'+(img?'<img src="'+escapeHtml(img)+'" alt="'+escapeHtml(name)+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span class=&quot;material-icons-round&quot; style=&quot;font-size:42px&quot;>restaurant</span>\';">':'<span class="material-icons-round" style="font-size:42px">restaurant</span>')+'</div><div class="menu-info"><h4>'+escapeHtml(name)+'</h4><div class="price">'+money(it.price)+'</div><div class="add-row"><button type="button" class="qty-btn" data-menu-action="qty" data-menu-name="'+escapeHtml(name)+'" data-menu-delta="-1">−</button><div class="qty">'+qty+'</div><button type="button" class="qty-btn" data-menu-action="qty" data-menu-name="'+escapeHtml(name)+'" data-menu-delta="1">+</button></div></div></div>';}grid.innerHTML=html||'<div class="panel">Menu belum tersedia. Untuk tab Rekomendasi, isi kolom H dengan kata Rekomendasi pada sheet Menu Bakerzin.</div>';}
    function findMenu(name){var all=[],i;if(State.catalog&&State.catalog.items)all=all.concat(State.catalog.items);if(State.catalog&&State.catalog.recommendations)all=all.concat(State.catalog.recommendations);for(i=0;i<all.length;i++){if(all[i]&&all[i].name===name)return all[i];}return null;}
    function changeQty(name,delta){var it=findMenu(name);if(!it)return false;var cur=(State.cart[name]&&State.cart[name].qty)?State.cart[name].qty:0,next=Math.max(0,cur+delta);if(next===0)delete State.cart[name];else State.cart[name]={name:it.name,price:it.price,qty:next,category:it.category,image:it.image};renderMenu();updateCart();return false;}
    function cartItems(){var arr=[];for(var k in State.cart){if(State.cart.hasOwnProperty(k))arr.push(State.cart[k]);}return arr;}
    function getSelectedDeliveryFee(){return 0;}
    function calcOrderTotals(items){items=items||cartItems();var subtotal=0;for(var i=0;i<items.length;i++)subtotal+=(parseFloat(items[i].price)||0)*(parseInt(items[i].qty,10)||0);var taxable=State.flow==='delivery'||State.flow==='takeaway';var pb1=taxable?Math.round(subtotal*.10):0;var deliveryFee=0;return {subtotal:subtotal,pb1:pb1,deliveryFee:deliveryFee,grandTotal:subtotal+pb1+deliveryFee};}
    function updateCart(){var items=cartItems(),qty=0;for(var i=0;i<items.length;i++)qty+=items[i].qty;var totals=calcOrderTotals(items);if($('cart-count'))$('cart-count').textContent=qty+' item';if($('cart-total'))$('cart-total').textContent=(State.flow==='delivery'||State.flow==='takeaway')?'Grand Total '+money(totals.grandTotal):money(totals.subtotal);var menuActive=$('menu-page')&&$('menu-page').className.indexOf('active')>=0;toggleClass($('cart-bar'),'visible',!!(menuActive&&qty>0));}
    function validate(){
      if(State.flow==='reservation'){var rd={name:$('res-name').value.trim(),phone:$('res-phone').value.trim(),pax:parseInt($('res-pax').value,10)||0,outlet:$('res-outlet').value,date:$('res-date').value,time:$('res-time').value,note:$('res-note').value.trim(),items:State.wantsMenu?cartItems():[]};if(!rd.name||!rd.phone||!rd.pax||!rd.outlet||!rd.date||!rd.time)return{ok:false,msg:'Lengkapi nama, no telp, jumlah pax, outlet, tanggal, dan jam.'};if(State.wantsMenu&&rd.items.length===0)return{ok:false,msg:'Pilih minimal 1 menu atau pilih NO.'};return{ok:true,data:rd};}
      var isDel=State.flow==='delivery',items=cartItems(),totals=calcOrderTotals(items);var d={type:isDel?'DELIVERY':'TAKE_AWAY',name:$('ord-name').value.trim(),phone:$('ord-phone').value.trim(),recipientName:isDel?$('rcp-name').value.trim():'',recipientPhone:isDel?$('rcp-phone').value.trim():'',outlet:$('ord-outlet').value,date:$('ord-date').value,time:$('ord-time').value,address:isDel?$('ord-address').value.trim():'',deliveryArea:'',deliveryFee:0,note:$('ord-note').value.trim(),items:items,subtotal:totals.subtotal,pb1:totals.pb1,grandTotal:totals.grandTotal};if(!d.name||!d.phone||!d.outlet||!d.date||!d.time)return{ok:false,msg:'Lengkapi data pemesan, outlet, tanggal, dan jam.'};if(isDel&&(!d.recipientName||!d.recipientPhone||!d.address))return{ok:false,msg:'Lengkapi data penerima dan alamat pengantaran.'};if(d.items.length===0)return{ok:false,msg:'Pilih minimal 1 menu.'};return{ok:true,data:d};
    }
    function openPreview(){var v=validate();if(!v.ok){alert(v.msg);return false;}var d=v.data,items=d.items||[],totals=State.flow==='reservation'?{subtotal:sumItems(items),pb1:0,deliveryFee:0,grandTotal:sumItems(items)}:calcOrderTotals(items);d.subtotal=totals.subtotal;d.pb1=totals.pb1;d.deliveryFee=totals.deliveryFee;d.grandTotal=totals.grandTotal;var html='<div class="preview-card" style="padding:14px;box-shadow:none"><div class="summary-row"><span>Jenis</span><span>'+(State.flow==='reservation'?'Reservasi':State.flow==='delivery'?'Delivery':'Pickup / Take Away')+'</span></div><div class="summary-row"><span>Nama</span><span>'+escapeHtml(d.name)+'</span></div><div class="summary-row"><span>No Telp</span><span>'+escapeHtml(normalizePhone(d.phone))+'</span></div>'+(State.flow==='reservation'?'<div class="summary-row"><span>Pax</span><span>'+escapeHtml(d.pax)+'</span></div>':'')+'<div class="summary-row"><span>Outlet</span><span>'+escapeHtml(d.outlet)+'</span></div><div class="summary-row"><span>Tanggal / Jam</span><span>'+escapeHtml(d.date)+' · '+escapeHtml(d.time)+'</span></div>'+(d.address?'<div class="summary-row"><span>Alamat</span><span>'+escapeHtml(d.address)+'</span></div>':'')+(d.note?'<div class="summary-row"><span>Keterangan</span><span>'+escapeHtml(d.note)+'</span></div>':'');if(items.length){html+='<br><strong>Menu</strong>';for(var i=0;i<items.length;i++)html+='<div class="summary-row"><span>'+escapeHtml(items[i].name)+' x'+items[i].qty+'</span><span>'+money(items[i].price*items[i].qty)+'</span></div>';if(State.flow==='reservation')html+='<div class="summary-row"><span>Total Estimasi</span><span>'+money(totals.subtotal)+'</span></div>';else html+='<div class="total-breakdown"><div class="summary-row"><span>Subtotal</span><span>'+money(totals.subtotal)+'</span></div><div class="summary-row"><span>PB1 10%</span><span>'+money(totals.pb1)+'</span></div>'+'<div class="summary-row grand"><span>Grand Total</span><span>'+money(totals.grandTotal)+'</span></div></div>';}if(State.flow==='delivery'){html+='<div style="margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(217,75,100,.06);border:1px solid rgba(217,75,100,.18);font-size:.76rem;color:var(--danger);line-height:1.6"><strong style="font-size:.78rem">Catatan Delivery Fee:</strong><ul style="margin:6px 0 0 0;padding-left:16px"><li>Harga yang tertera belum termasuk biaya pengiriman (Delivery Fee).</li><li>Besaran Delivery Fee akan disesuaikan berdasarkan jarak pengiriman, jumlah pesanan, serta jenis armada atau layanan kurir yang digunakan.</li><li>Delivery Fee berlaku untuk setiap alamat pengiriman.</li><li>Apabila alamat pengiriman berada lebih dari 10 km dari outlet Bakerzin terdekat, pesanan akan terlebih dahulu dikonfirmasi oleh tim kami melalui WhatsApp untuk memastikan ketersediaan layanan.</li><li>Nominal Delivery Fee akan diinformasikan oleh tim Bakerzin melalui WhatsApp bersamaan dengan proses konfirmasi pesanan sebelum pesanan diproses lebih lanjut.</li></ul></div>';}else html+='<br><p style="color:var(--muted)">Tanpa pemesanan menu.</p>';html+='</div>';$('preview-body').innerHTML=html;addClass($('preview-modal'),'visible');return false;}
    function sumItems(items){var s=0;for(var i=0;i<items.length;i++)s+=(parseFloat(items[i].price)||0)*(parseInt(items[i].qty,10)||0);return s;}
    function closePreview(){removeClass($('preview-modal'),'visible');return false;}
    function submitCurrentFlow(){var v=validate();if(!v.ok){alert(v.msg);return false;}var btn=$('confirm-submit');btn.disabled=true;btn.innerHTML='<span class="material-icons-round">hourglass_top</span> Mengirim...';function finish(ok,msg){btn.disabled=false;btn.innerHTML='<span class="material-icons-round">send</span> Submit';closePreview();if(!ok){alert(msg||'Gagal submit.');return;}var d=v.data;if(State.flow==='reservation')$('success-message').innerHTML='Terimakasih telah melakukan Reservasi di Bakerzin '+escapeHtml(d.outlet)+' Pada tanggal '+escapeHtml(d.date)+' jam '+escapeHtml(d.time)+', Team Kami akan menyiapkan Reservasi Anda<br><br><strong>Note :</strong> Harap datang minimal 15 Menit sebelum jam reservasi, jika tidak datang 15 menit setelah waktu ditentukan, maka reservasi dianggap batal';else $('success-message').textContent='Terimakasih telah melakukan pemesanan di Bakerzin '+d.outlet+', Team Kami akan menyiapkan pesanan dan segera menghubungi untuk proses pembayaran';showPage('success-page');}
      if(!hasBackend()){finish(false,'Backend belum dikonfigurasi.');return false;}var action=State.flow==='reservation'?'saveCustomerReservation':'saveCustomerOrder';apiCall(action,v.data).then(function(res){finish(res&&res.success,res&&res.message);}).catch(function(err){console.error(action+':',err);finish(false,err&&err.message?err.message:'Gagal terhubung ke server.');});return false;}

    window.BZApp={openFlow:openFlow,version:PATCH};
    window.openFlow=openFlow;window.goHome=goHome;window.resetApp=resetApp;window.syncRecipient=syncRecipient;window.setReservationMenuChoice=setReservationMenuChoice;window.checkReservationOutlet=checkReservationOutlet;window.openMenuSelector=openMenuSelector;window.backToForm=backToForm;window.setCategory=setCategory;window.setMenuSearch=setMenuSearch;window.clearMenuSearch=clearMenuSearch;window.changeQty=changeQty;window.updateCart=updateCart;window.openPreview=openPreview;window.closePreview=closePreview;window.submitCurrentFlow=submitCurrentFlow;
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
  })();
  </script>
